name: Check
on:
  push:
  pull_request:

jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run verify

  hono:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hono-effect
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  sveltekit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sveltekit-effect
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
